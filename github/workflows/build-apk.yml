name: Build Palestine Radio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PalestineRadio-AndroidTV-PhoneBuild.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the project ZIP exists
        run: test -f PalestineRadio-AndroidTV-PhoneBuild.zip

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q PalestineRadio-AndroidTV-PhoneBuild.zip -d extracted
          test -f extracted/PalestineRadio/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p extracted/PalestineRadio assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PalestineRadio-debug-apk
          path: extracted/PalestineRadio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
